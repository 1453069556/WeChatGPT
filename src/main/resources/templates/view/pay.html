    <div id="showPicker" role="button" aria-haspopup="listbox"
         class="weui-cell weui-cell_active weui-cell_select weui-cell_select-after" wah-hotarea="click">
        <div class="weui-cell__hd"><label class="weui-label">票种</label></div>
        <div class="weui-cell__bd">
            <div class="weui-select">的士票</div>
        </div>
    </div>
</div>
<div id="payment-section" style="display: none;">
    <div class="weui-cells__title">选择支付项目</div>
    <div class="weui-cells weui-cells_form">
        <div class="weui-cell weui-cell_select weui-cell_select-before">
            <div class="weui-cell__hd">
                <select class="weui-select" id="payment-select">
                    <!-- Thymeleaf 从后端获取数据，填充下拉菜单选项 -->
                </select>
            </div>
        </div>
    </div>
    <a href="javascript:;" class="weui-btn weui-btn_primary" id="pay-btn">立即支付</a>
</div>

</html>

<script>
    document.getElementById('reject-btn').onclick = function () {
        // 点击拒绝后关闭窗口并返回微信公众号页面
        window.location.href = 'http://mp.weixin.qq.com/s/your_article_url'; // 请将your_article_url替换为实际的文章URL
    };

    document.getElementById('accept-btn').onclick = function () {
        // 点击同意后隐藏阅读条款框，显示支付部分
        document.getElementById('terms-dialog').style.display = 'none';
        document.getElementById('payment-section').style.display = 'block';
    };

    document.getElementById('pay-btn').onclick = function () {
        // 从后端获取预付单信息
        fetch('/get_prepay_info', {
            method: 'POST',
            body: JSON.stringify({payment_item: document.getElementById('payment-select').value}),
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => response.json())
            .then(prepayInfo => {
                // 使用微信JS-SDK进行支付
                wx.chooseWXPay({
                    timestamp: prepayInfo.timestamp,
                    nonceStr: prepayInfo.nonceStr,
                    package: 'prepay_id=' + prepayInfo.prepayId,
                    signType: 'MD5',
                    paySign: prepayInfo.paySign,
                    success: function (res) {
                        // 支付成功后的回调函数
                        alert('支付成功');
                    },
                    fail: function (res) {
                        // 支付失败后的回调函数
                        alert('支付失败');
                    },
                    cancel: function (res) {
                        // 用户取消支付后的回调函数
                        alert('支付已取消');
                    }
                });
            })
            .catch(error => {
                console.error('Error fetching prepay info:', error);
            });
    };
</script>
