<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>我的会员</title>
    <!-- 三方 -->
    <link rel="stylesheet" th:href="@{/css/vant2.12.css}"/>
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>

<body>
<div id="app">
    <div class="paypage">
        <van-nav-bar title="我的会员" left-arrow>
            <template #left>
                <van-icon name="arrow-left" size="18" color="#1E1E1E"/>
            </template>
        </van-nav-bar>

        <div class="user">
            <div class="imagine">
                <img :src="imagine" alt=""/>
            </div>
            <div class="message">
                <p class="name">{{name}}</p>
                <p class="uid"><span>ID：</span> {{uid}}</p>
            </div>
        </div>

        <div class="notice">
            <van-notice-bar left-icon="volume-o"
                            text="买超级会员，走专属通道，无限AI次数，响应更快，快冲快冲！！！yyds"></van-notice-bar>
        </div>

        <div class="pay-box">
            <div :style="{'width':width +'%'}">
                <div :class="['pay-item',active==item.id?'ac':'']" v-for="item in list" :key="item.id"
                     @click="getMeal(item)">
                    <div class="time">{{item.date}}</div>
                    <div class="newprice">
                        <span>￥</span>
                        <span>{{item.price}}</span>
                    </div>
                    <div class="price">￥{{item.oPrice}}</div>
                    <div class="saveprice">{{item.discounts}}</div>
                </div>
            </div>
        </div>

        <div class="agree">
            <van-checkbox v-model="checked" icon-size="16px" checked-color="#F17E64"><span>《会员使用服务协议》</span>
            </van-checkbox>
        </div>

        <div class="payprice" @click="onPay">立即开通</div>
    </div>
</div>

<script th:src="@{/js/vue.min.js}"></script>
<script th:src="@{/js/vant.min.js}"></script>
<script th:src="@{/js/flex.js}"></script>
<!-- 引入jQuery和WeUI JS -->
<script src="https://res2.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!--<script th:src="@{/js/index.js}"></script>-->
</body>

</html>

<script th:inline="javascript">
    let openid = [[${openid}]];
    let appId = [[${appId}]];
    let timestamp = [[${timestamp}]];
    let nonceStr = [[${nonceStr}]];
    let signature = [[${signature}]];
    let MembershipPricing = JSON.parse([[${MembershipPricing}]]);
    // let UserAgreement = [[${UserAgreement}]];
    new Vue({
        el: "#app",

        data() {
            return {
                imagine: "/image/搞怪.png",
                name: "mine", // 获取用户名字
                uid: "123456789", // 获取用户id
                checked: true,
                active: 1,
                list: MembershipPricing
            };
        },
        computed: {
            width() {
                return this.list.length > 3 ? (this.list.length - 3) * 34 + 100 : 100;
            },
        },
        methods: {
            onClickLeft() {
                Toast("返回");
            },
            onClickRight() {
                Toast("按钮");
            },
            getMeal(item) {
                const {id} = item;
                this.active = id;
            },
            onPay() {
                const item = this.list.find((e) => e.id === this.active);

                this.callWechatPay(item.id);
            },
            callWechatPay(id) {
                wx.config({
                    // debug: true,
                    appId: appId,
                    timestamp: timestamp,
                    nonceStr: nonceStr,
                    signature: signature,
                    jsApiList: ["chooseWXPay"],
                });
                $.ajax({
                    url: "/pay/getWechatPayParams",
                    method: "POST",
                    data: {
                        id: id,
                        openid: openid,
                    },
                    success: function (response) {
                        wx.chooseWXPay({
                            timestamp: response.timeStamp,
                            nonceStr: response.nonceStr,
                            package: response.packageValue,
                            signType: response.signType,
                            paySign: response.paySign,
                            success: function (res) {
                                weui.toast("支付成功", 3000);
                            },
                            fail: function (res) {
                                weui.alert("支付失败");
                            },
                        });
                    },
                    error: function (err) {
                        weui.alert("支付失败");
                        console.log(err);
                    },
                });
            },
        },
    });
</script>
